name: Security

# OFF THE PUSH PATH ON PURPOSE (2026-08-14 audit #48).
#
# npm audit answers against a MOVING advisory database: the same commit
# can pass today and go red tomorrow with zero code change. A gate like
# that on push trains exactly the wrong reflex — red builds nobody
# believes. So this runs weekly (and by hand), and a red run here is a
# SIGNAL TO LOOK, not a broken main. The other half of the loop is
# dependabot.yml, which proposes the bumps that clear what audit reports.
on:
  schedule:
    - cron: '30 1 * * 1' # Mondays 01:30 UTC = 07:00 IST
  workflow_dispatch:

# One audit at a time, queued not cancelled: a hand-triggered audit should
# wait for the scheduled one, not abort it.
concurrency:
  group: security-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # HIGH+ only: low/moderate noise in a devDependency tree teaches
      # people to ignore the channel the signal travels on.
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
