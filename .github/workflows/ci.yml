name: CI

on:
  push:
    branches: [main]
  pull_request:

# LEAST PRIVILEGE (2026-08-13). Nothing here writes the repo, issues, or
# packages — so nothing is allowed to. A future step that needs more must
# say so in this file, which makes the elevation a reviewable diff.
permissions:
  contents: read

jobs:
  # THE SUITE, IN EIGHT PORTIONS (round 53, widened round 62).
  #
  # One job used to run every test file serially: every jsdom document,
  # every crash risk and every minute of wall time concentrated in one
  # place. The runner (tools/ci-test.mjs --shard i/n) deals the sorted test
  # files round-robin into n slices, so each job runs a disjoint portion and
  # prints its own TEST SUMMARY block (verdict, counts, duration, per-failure
  # name/location/time/reason). fail-fast is OFF on purpose: all eight
  # summaries must land, because the point of portions is seeing the whole
  # picture, not stopping at the first cut. Eight slices keep each job small
  # and fast, and a failure isolates to a narrower band of files.
  test:
    runs-on: ubuntu-latest
    # A hung jsdom document or a stuck import must not eat a runner for six
    # hours; a healthy shard is done in a small fraction of this.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          # One lockfile today; pinned anyway so a second lockfile never
          # silently becomes the cache basis (2026-08-14 audit #12).
          cache-dependency-path: package-lock.json

      # jsdom is required. test:ci fails if any test skips, so a missing
      # install cannot quietly reduce the suite to the headless subset --
      # in ANY shard.
      - run: npm ci

      - name: Test shard ${{ matrix.shard }} (fails on skips)
        run: node tools/ci-test.mjs --shard ${{ matrix.shard }}

  # The non-test gates. Split out so the eight shards do not pay for them
  # eight times, and so a test failure does not hide their results.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The pipeline's own health, before any suite pays for the day:
      # shard completeness recomputed through the runner itself, required
      # scripts, the workflow's own teeth (permissions, timeouts, install
      # count, hard gates, the verdict job).
      - name: CI self-integrity
        run: node tools/ci-selfcheck.mjs

      - name: Theme contrast (WCAG AA)
        run: npm run contrast

      # M5 (2026-08-13): the contract surfaces typecheck — ctx, the settings
      # schema, the store, the storage seam. Regex pins stay as the runtime
      # census; this is the compiler's say over the same ground.
      - name: Contract typecheck (checkJs)
        run: npm run types

      - name: Benchmark (data layer)
        run: npm run bench

      # Exactly ONE browser install; the bench and the smoke gate both
      # reuse it through the job's shared cache (the workflow previously
      # installed Chromium once per step). The fallback keeps the useful
      # signal: a --with-deps failure prints a warning instead of hiding.
      # The executable is the PROJECT's playwright-core (2026-08-14 audit
      # #43/#44), not npx: npx resolution can fetch when the local bin is
      # absent, which is exactly the supply-chain shape a pinned dependency
      # exists to prevent. npm ci above guarantees the bin is there.
      - name: Install Chromium (once)
        run: |
          node_modules/.bin/playwright-core install chromium --with-deps || { echo "::warning::install --with-deps failed; retrying without system deps"; node_modules/.bin/playwright-core install chromium; }

      - name: Rendering benchmark (numbers, advisory)
        run: timeout 600 npm run render:bench || echo "render:bench unavailable in this environment (see tools/render-bench.mjs)"

      # The hard browser gate (direction M2, 2026-08-13). The bench REPORTS
      # numbers and soft-fails on exotic environments; the smoke suite
      # ASSERTS user-visible truths (the drawer never self-opens, compose
      # never touches the rail, settings keeps one visible panel...) and a
      # failure here fails the build. Runs on the demo preview so no gate
      # ever depends on network luck.
      - name: Browser smoke gates (headless Chromium)
        run: |
          node tools/make-preview.mjs
          timeout 600 node tools/ci-smoke.mjs

      # Failure has a SCENE: screenshot, DOM, captured console, and a
      # Playwright trace (2026-08-14 audit #38 — the piece that makes an
      # intermittent browser failure replayable), uploaded only when
      # something above fell (if-no-files-found says a green run leaves
      # nothing, which is exactly right).
      - name: Failure evidence (smoke)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-failure
          path: |
            .smoke-failure.png
            .smoke-failure.html
            .smoke-failure.txt
            .smoke-trace.zip
          if-no-files-found: ignore
          retention-days: 7

      # The shard manifest survives EVERY run (2026-08-14 audit #8/#23):
      # which file went to which slice, how many, disjoint/complete — the
      # evidence the completeness claim rests on, kept for green runs too
      # because "what did CI actually execute?" is a question you ask after
      # a PASS as often as after a failure. Written by ci-selfcheck.mjs
      # above; small enough that retention is free.
      - name: Shard manifest (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-manifest
          path: .ci-manifest.json
          if-no-files-found: ignore
          retention-days: 30

      # The rule files are generated from docs/CLASSIFICATION_DATA_PACK.md.
      # Regenerating must be a no-op; a diff means someone hand-edited the
      # output, which is how the first port silently lost 802 of 891 keys.
      - name: Generated files are in sync
        run: |
          node tools/gen-pattern-rules.mjs docs/CLASSIFICATION_DATA_PACK.md
          node tools/gen-address-map.mjs docs/CLASSIFICATION_DATA_PACK.md
          git diff --exit-code -- src/classify/pattern-rules.js src/classify/address-map.js

  # THE VERDICT (2026-08-13). A REAL aggregate: if: always() so a cancelled
  # or failed need is still read, and the gate fails on any result that is
  # not verbatim "success" — including "cancelled", which a naive check
  # turns into a pass. Nothing echoes "all checks passed"; the results are
  # read. Branch protection should name this ONE job.
  ci-verdict:
    name: Verdict
    if: always()
    needs: [test, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate gate
        env:
          TEST: ${{ needs.test.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "test=$TEST checks=$CHECKS"
          if [ "$TEST" != "success" ] || [ "$CHECKS" != "success" ]; then
            echo "::error::a required job did not succeed (test=$TEST checks=$CHECKS)"
            exit 1
          fi
