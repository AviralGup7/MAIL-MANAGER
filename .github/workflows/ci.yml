name: CI

on:
  push:
    branches: [main]
  pull_request:

# LEAST PRIVILEGE (2026-08-13). Nothing here writes the repo, issues, or
# packages — so nothing is allowed to. A future step that needs more must
# say so in this file, which makes the elevation a reviewable diff.
permissions:
  contents: read

# SUPERSEDED RUNS CANCEL THEMSELVES (2026-08-14). A push to the same ref
# makes any in-flight run's verdict stale before it arrives: main has
# already moved, and the PR author is about to push again. The cancelled
# run stays in history — nothing is hidden, just not paid for twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE SUITE, IN EIGHT PORTIONS (round 53, widened round 62).
  #
  # One job used to run every test file serially: every jsdom document,
  # every crash risk and every minute of wall time concentrated in one
  # place. The runner (tools/ci-test.mjs --shard i/n) deals the sorted test
  # files round-robin into n slices, so each job runs a disjoint portion and
  # prints its own TEST SUMMARY block (verdict, counts, duration, per-failure
  # name/location/time/reason). fail-fast is OFF on purpose: all eight
  # summaries must land, because the point of portions is seeing the whole
  # picture, not stopping at the first cut. Eight slices keep each job small
  # and fast, and a failure isolates to a narrower band of files.
  test:
    runs-on: ubuntu-latest
    # A hung jsdom document or a stuck import must not eat a runner for six
    # hours; a healthy shard is done in a small fraction of this.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          # One lockfile today; pinned anyway so a second lockfile never
          # silently becomes the cache basis (2026-08-14 audit #12).
          cache-dependency-path: package-lock.json

      # jsdom is required. test:ci fails if any test skips, so a missing
      # install cannot quietly reduce the suite to the headless subset --
      # in ANY shard.
      - run: npm ci

      - name: Test shard ${{ matrix.shard }} (fails on skips)
        run: node tools/ci-test.mjs --shard ${{ matrix.shard }}

  # The non-test gates that need no browser. Split out so the eight shards
  # do not pay for them eight times, and so a test failure does not hide
  # their results.
  #
  # WHY THIS JOB NO LONGER OWNS THE BROWSER (2026-08-17).
  #
  # MEASURED on run 32013206837: `checks` took 80s while the slowest of the
  # eight shards took 49s — so this job, not the suite, was the critical
  # path of every build. The breakdown was unambiguous:
  #
  #     Install Chromium (once)   24s
  #     Rendering benchmark       16s
  #     Browser smoke gates       15s
  #     ------------------------------
  #     everything else          ~25s
  #
  # Three steps carried 55 of the 80 seconds, and none of them depends on
  # lint, typecheck, docs or coverage. They now live in a SEPARATE job
  # (`browser`) that runs in PARALLEL with this one, so the slow half no
  # longer serialises behind the fast half. Both remain required by the
  # verdict, so no coverage is traded for the speed.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The pipeline's own health, before any suite pays for the day:
      # shard completeness recomputed through the runner itself, required
      # scripts, the workflow's own teeth (permissions, timeouts, install
      # count, hard gates, the verdict job).
      - name: CI self-integrity
        run: node tools/ci-selfcheck.mjs

      # Audit 64's F4 as a gate (2026-08-14): the indexes, the README's
      # stated test count (recomputed from declared test() calls), and the
      # STRUCTURE folder law. Docs here are load-bearing, so their drift is
      # a build failure like every other drift class.
      - name: Docs are true
        run: node tools/check-docs.mjs

      # LINT (2026-08-15). 35,000 lines of JS had no linter, and the first
      # run found three LIVE bugs in one pass: `startReply` and
      # `CATEGORY_LABELS` used without being imported (a ReferenceError on
      # every palette Reply/Reply-all/Forward, and on any saved view filtering
      # by category), plus a duplicate key in the ctx object. None of the
      # 2,059 tests could see any of them.
      #
      # The config is correctness-only — no stylistic rules — so a red build
      # here means a defect, never a formatting opinion. Hard gate.
      - name: Lint (correctness rules; no style)
        run: npm run lint

      - name: Theme contrast (WCAG AA)
        run: npm run contrast

      # THE DRIFT DETECTORS (2026-08-15 CI audit).
      #
      # Both existed, both were runnable by hand, and NEITHER was wired in —
      # so the only thing standing between the codebase and the drift they
      # detect was somebody remembering to type the command. `operators` was
      # in fact reporting drift at the moment this was added (a false positive
      # of its own, fixed in the same commit); nobody had run it in long
      # enough for that to matter, which is the whole argument for the gate.
      #
      #   operators   — the parser and the suggestion list must agree, or the
      #                 app teaches a syntax it cannot execute.
      #   departments — timetable-mail.js hard-codes the department vocabulary
      #                 to avoid loading a 652KB JSON on the ingest path; the
      #                 day the timetable is regenerated with a new one,
      #                 course detection silently stops seeing it.
      - name: Search operators and the teaching surface agree
        run: npm run operators

      - name: Department vocabulary matches the timetable
        run: npm run departments

      # The load-time doctor: the worker's module graph resolves, the manifest
      # names files that exist, match patterns are valid. It is the check that
      # catches "Service worker registration failed" BEFORE a browser does,
      # and it is cheap enough that there is no reason it was ever manual.
      - name: Extension loads (worker graph, manifest, key)
        run: npm run doctor

      # The Python surface is one 85-line icon generator, so the value is
      # small — but ruff is a single fast binary and an ungated language in
      # the tree is how the next Python file arrives unlinted. Pinned so a
      # new ruff release cannot redden a build that did not change.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Lint Python (ruff)
        run: |
          pip install --quiet ruff==0.16.3
          ruff check tools/

      # M5 (2026-08-13): the contract surfaces typecheck — ctx, the settings
      # schema, the store, the storage seam. Regex pins stay as the runtime
      # census; this is the compiler's say over the same ground.
      - name: Contract typecheck (checkJs)
        run: npm run types

      # A declared gate must have teeth. This selected critical-module run is
      # bounded and independent of the eight full-suite shards.
      - name: Critical-module coverage floors
        run: npm run coverage

      - name: Benchmark (data layer)
        run: npm run bench

      # The shard manifest survives EVERY run (2026-08-14 audit #8/#23):
      # which file went to which slice, how many, disjoint/complete — the
      # evidence the completeness claim rests on, kept for green runs too
      # because "what did CI actually execute?" is a question you ask after
      # a PASS as often as after a failure. Written by ci-selfcheck.mjs
      # above; small enough that retention is free.
      - name: Shard manifest (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-manifest
          path: .ci-manifest.json
          if-no-files-found: ignore
          retention-days: 30

      # The rule files are generated from docs/CLASSIFICATION_DATA_PACK.md.
      # Regenerating must be a no-op; a diff means someone hand-edited the
      # output, which is how the first port silently lost 802 of 891 keys.
      - name: Generated files are in sync
        run: |
          node tools/gen-pattern-rules.mjs docs/CLASSIFICATION_DATA_PACK.md
          node tools/gen-address-map.mjs docs/CLASSIFICATION_DATA_PACK.md
          git diff --exit-code -- src/classify/pattern-rules.js src/classify/address-map.js

  # THE BROWSER GATES, IN THEIR OWN JOB (2026-08-17).
  #
  # Chromium install + render bench + smoke gates were 55s of the old
  # `checks` job's 80s, and made `checks` the critical path of the whole
  # build (the slowest test shard was 49s). Nothing here depends on the
  # lint/typecheck/docs gates, so running them in series was pure wall
  # clock. The browser download is cached too, which removes most of the
  # 24s install whenever the lockfile is unchanged.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # THE DOWNLOAD IS CACHED; THE INSTALL STEP STILL RUNS.
      # Keyed on the lockfile, so a playwright-core bump invalidates it and
      # a stale browser can never survive an upgrade. The install below is
      # still executed on a cache hit — it is a near-no-op when the binary
      # is already present, and it stays the ONE place that puts a browser
      # on the box (the invariant ci-selfcheck enforces).
      - name: Cache Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Exactly ONE browser install; the bench and the smoke gate both
      # reuse it through the job's shared cache (the workflow previously
      # installed Chromium once per step). The fallback keeps the useful
      # signal: a --with-deps failure prints a warning instead of hiding.
      # The executable is the PROJECT's playwright-core (2026-08-14 audit
      # #43/#44), not npx: npx resolution can fetch when the local bin is
      # absent, which is exactly the supply-chain shape a pinned dependency
      # exists to prevent. npm ci above guarantees the bin is there.
      - name: Install Chromium (once)
        run: |
          node_modules/.bin/playwright-core install chromium --with-deps || { echo "::warning::install --with-deps failed; retrying without system deps"; node_modules/.bin/playwright-core install chromium; }

      # Audit 64's F2, closed 2026-08-14: paint numbers are a HARD gate.
      # The bench itself splits its failure classes — exit 2 means "no
      # runnable Chromium here" (soft, warns), exit 1 means a threshold
      # moved (red, fails the build). A soft-| everything used to let a
      # genuinely slower render wear the same green as a healthy one.
      - name: Rendering benchmark (thresholds hard; infra soft)
        env:
          # CI runners are shared 2-core SwiftShader boxes, and the numbers
          # there are a different distribution from local: three measured
          # CI runs (2026-08-13) gave page-avg 2602/2900/3435ms and search
          # 4277/5040/6164ms — the DEFAULT limits (2500/2500) were tuned on
          # a quieter machine, and the soft-echo era hid that entirely
          # (F2's closing measurement). These ceilings sit ~1.5x the worst
          # observed; the regressions this bench exists to catch (an
          # O(n^2) render path, a reflow per keystroke, a surviving rAF
          # loop) move medians by multiples, not by 50%, so the gate keeps
          # its teeth. Tighten when CI hardware moves.
          # FIVE MEASURED CI RUNS, oldest to newest:
          #   page   2602 / 2900 / 3435 / 3380 / 3910 ms
          #   search 4277 / 5040 / 6164 / 5869 / 6893 ms
          #
          # These ceilings are LEFT AT 5000/9000 on purpose. They sit 1.28x
          # and 1.31x over the worst observation, which is correct for a
          # shared 2-core SwiftShader runner whose own run-to-run noise is
          # ~17% (3380 -> 3910 on consecutive commits, no code change in
          # between). A 2026-08-15 attempt to "tighten" them to 4600/8000 was
          # reverted before it shipped: it left less headroom than the
          # measured noise, which builds a gate that reddens on runner luck
          # and teaches everyone to re-run CI until it passes.
          #
          # THE REAL PROBLEM THIS BENCH CANNOT SEE, recorded here because the
          # numbers above are the evidence: page render is up ~50% and search
          # up ~61% across those five runs. Every one of them PASSED, because
          # an absolute ceiling cannot distinguish "slower hardware today"
          # from "we got slower". A ratchet (compare against the last N runs
          # and fail on a sustained upward step) is the fix; it needs run
          # history persisted between builds, which this workflow does not
          # have yet. Tracked in docs/NEXT.md rather than faked with a
          # tighter constant.
          RENDER_BENCH_PAGE_MS: '5000'
          RENDER_BENCH_SEARCH_MS: '9000'
        run: |
          timeout 600 npm run render:bench || code=$?; case "${code:-0}" in
            0) ;;
            2) echo "::warning::render bench unavailable in this environment (no runnable Chromium)";;
            *) echo "::error::render bench thresholds breached"; exit ${code};;
          esac

      # The hard browser gate (direction M2, 2026-08-13). The bench REPORTS
      # numbers and soft-fails on exotic environments; the smoke suite
      # ASSERTS user-visible truths (the drawer never self-opens, compose
      # never touches the rail, settings keeps one visible panel...) and a
      # failure here fails the build. Runs on the demo preview so no gate
      # ever depends on network luck.
      - name: Browser smoke gates (headless Chromium)
        run: |
          node tools/make-preview.mjs
          timeout 600 node tools/ci-smoke.mjs

      # Failure has a SCENE: screenshot, DOM, captured console, and a
      # Playwright trace (2026-08-14 audit #38 — the piece that makes an
      # intermittent browser failure replayable), uploaded only when
      # something above fell (if-no-files-found says a green run leaves
      # nothing, which is exactly right).
      - name: Failure evidence (smoke)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-failure
          path: |
            .smoke-failure.png
            .smoke-failure.html
            .smoke-failure.txt
            .smoke-trace.zip
          if-no-files-found: ignore
          retention-days: 7

  # THE VERDICT (2026-08-13). A REAL aggregate: if: always() so a cancelled
  # or failed need is still read, and the gate fails on any result that is
  # not verbatim "success" — including "cancelled", which a naive check
  # turns into a pass. Nothing echoes "all checks passed"; the results are
  # read. Branch protection should name this ONE job.
  ci-verdict:
    name: Verdict
    if: always()
    needs: [test, checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate gate
        env:
          TEST: ${{ needs.test.result }}
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "test=$TEST checks=$CHECKS browser=$BROWSER"
          # The run's Summary page carries the aggregate too (2026-08-14):
          # per-shard TEST SUMMARY blocks already land there from the
          # runner; this table is the one-glance answer above them.
          {
            echo "## CI verdict"
            echo ""
            echo "| gate | result |"
            echo "| --- | --- |"
            echo "| test (8 shards) | $TEST |"
            echo "| checks | $CHECKS |"
            echo "| browser | $BROWSER |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEST" != "success" ] || [ "$CHECKS" != "success" ] || [ "$BROWSER" != "success" ]; then
            echo "::error::a required job did not succeed (test=$TEST checks=$CHECKS browser=$BROWSER)"
            exit 1
          fi
